<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="6" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
    </filter>
    <filter id="cloud" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
    </filter>
    <radialGradient id="light" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#B58A56"/>
      <stop offset="60%" stop-color="#936B40"/>
      <stop offset="100%" stop-color="#5A3C22"/>
    </radialGradient>
  </defs>
  <rect width="700" height="700" fill="url(#light)"/>
  <rect width="700" height="700" filter="url(#cloud)" opacity="0.42"/>
  <rect width="700" height="700" filter="url(#grain)" opacity="0.62"/>
</svg>
