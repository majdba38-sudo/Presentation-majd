<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700">
  <defs>
    <filter id="fibers" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="5" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.34"/></feComponentTransfer>
    </filter>
    <filter id="stains" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="21" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.24  0 0 0 0 0.12  0 0 0 0.45 0"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#F3EAD6"/>
      <stop offset="65%" stop-color="#E8DDC8"/>
      <stop offset="100%" stop-color="#CDBB9B"/>
    </radialGradient>
  </defs>
  <rect width="700" height="700" fill="url(#glow)"/>
  <rect width="700" height="700" filter="url(#stains)" opacity="0.45"/>
  <rect width="700" height="700" filter="url(#fibers)" opacity="0.55"/>
</svg>
