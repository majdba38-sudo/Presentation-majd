<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <filter id="woodgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.28" numOctaves="4" seed="15" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
    </filter>
    <filter id="fine" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    </filter>
    <linearGradient id="walnut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A352A"/>
      <stop offset="50%" stop-color="#392820"/>
      <stop offset="100%" stop-color="#241A15"/>
    </linearGradient>
  </defs>
  <rect width="900" height="900" fill="url(#walnut)"/>
  <rect width="900" height="900" filter="url(#woodgrain)" opacity="0.5"/>
  <rect width="900" height="900" filter="url(#fine)" opacity="0.35"/>
</svg>
